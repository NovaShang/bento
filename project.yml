name: Bento
options:
  bundleIdPrefix: com.bento
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.4"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 7M23245ZBD

packages:
  BentoCore:
    path: .
  # Bento Term (product B) now rides the TRUNK modules from the root package —
  # BentoShelliOS + BentoTmuxPane + BentoTerminalPane + BentoLink (no
  # BentoAgentPane). The frozen term-side stack (SwiftTerm / Citadel / SwiftTmux
  # / BentoTerminalCore) retired with the SSH direct-connect port (P7).

targets:
  BentoIOS:
    type: application
    platform: iOS
    sources:
      - apps/BentoIOS/Sources
      - apps/BentoIOS/Resources
      - apps/BentoIOS/Assets.xcassets
    dependencies:
      # The umbrella (ACP pane + workbench) plus the shared iOS shell that the
      # app's thin composition root (AgentChatVC + acpStore) sits on top of.
      - package: BentoCore
      - package: BentoCore
        product: BentoShelliOS
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # iPad multitasking (Split View / Stage Manager free-resize) requires an
        # EXPLICIT all-four-orientation declaration — an absent key leaves the
        # app locked to a fixed window. iPhone keeps the default (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text for your agents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bento uses Face ID to protect your pairing keys."
        INFOPLIST_KEY_NSCameraUsageDescription: "Bento uses the camera to scan the pairing QR code shown by your Mac."
        ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: apps/BentoIOS/Info.plist
        # Target renamed BentoIOS; the artifact stays Bento.app.
        PRODUCT_NAME: Bento
        CODE_SIGN_STYLE: Automatic
        # ACP build: own id so it installs ALONGSIDE the terminal version
        # with a fresh container (no shared defaults/keychain/pairing).
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.app.acp
        # ...and its own name on the home screen, for the same reason: two
        # icons both labelled "Bento" is how the dev loop spent a session
        # driving the wrong app.
        INFOPLIST_KEY_CFBundleDisplayName: "Bento ACP"

  BentoIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/BentoIOSTests
    dependencies:
      - target: BentoIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  BentoMac:
    type: application
    platform: macOS
    sources:
      - apps/BentoMac/Sources
      - apps/BentoMac/Resources/Assets.xcassets
    dependencies:
      - package: BentoCore
      # The host-scoped half of the menu bar (daemon status + service control,
      # engine update/restart, pairing rows, the DaemonStatus model and the
      # `bento` CLI wrapper, the URL router) — shared with BentoTermMac so one
      # daemon can't be described two different ways. docs/menubar-unification.md.
      - package: BentoCore
        product: BentoMenuKit
    settings:
      base:
        # User-facing product name is "Bento ACP" — distinct from the old
        # terminal-era "Bento.app" so both can live in /Applications and run
        # side by side. The internal target name stays BentoMenubar to avoid
        # an Xcode-level collision with the iOS Bento target.
        PRODUCT_NAME: Bento ACP
        GENERATE_INFOPLIST_FILE: true
        # Merged with the generated plist (all INFOPLIST_KEY_* below still
        # apply). Carries only what has no INFOPLIST_KEY_ form — today the
        # `bento-acp://` URL scheme. docs/menubar-unification.md §4.1.
        INFOPLIST_FILE: apps/BentoMac/Info.plist
        INFOPLIST_KEY_LSUIElement: true       # menubar-only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Bento ACP"
        # Voice input touches the mic + (Apple engine) speech recognition. Without
        # these usage-description keys macOS TCC HARD-ABORTS the app the moment it
        # accesses the mic — the "hold right-click to record → crash" (BUG-017).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text for your agents."
        # Own bundle id (.acp suffix) so this installs alongside the old
        # terminal-era Bento menubar app (com.bento.menubar) with its own
        # prefs + Launch Services identity.
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.menubar.acp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App version surfaced in Finder/About and reported by Telemetry
        # (CFBundleShortVersionString). Bump alongside release tags.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/BentoMac/Resources/BentoMenubar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed Go binaries (bento + bento-daemon)"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ( cd "$SRCROOT/daemon" && make build )
          # APFS is case-insensitive, so the Swift `Bento` executable would
          # collide with the Go `bento` CLI in Contents/MacOS. Put helpers in
          # a sibling `helpers/` subdir so each binary has a distinct path.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          cp -f "$SRCROOT/daemon/bin/bento"        "$DEST/"
          cp -f "$SRCROOT/daemon/bin/bento-daemon" "$DEST/"

  # ════════ Bento Term (product B) — sources & behavior frozen from the ════════
  # terminal branch (merge^2). Same bundle ids as the shipping terminal apps;
  # only target names and directory prefixes differ (BentoTerm*/desktop-term)
  # so both products coexist in one project. Daemon unification is P7.
  BentoTermIOS:
    type: application
    platform: iOS
    sources:
      - apps/BentoTermIOS/Sources
      - apps/BentoTermIOS/Resources
      - apps/BentoTermIOS/Assets.xcassets
    dependencies:
      # Product B on TRUNK modules: the shared iOS shell + the tmux pane stack.
      # BentoTerminalPane (libghostty) rides in via BentoTmuxPane/BentoShelliOS;
      # BentoAgentPane and BentoCore's umbrella are deliberately NOT linked.
      - package: BentoCore
        product: BentoShelliOS
      - package: BentoCore
        product: BentoWorkbench
      - package: BentoCore
        product: BentoTerminalPane
      - package: BentoCore
        product: BentoTmuxPane
      - package: BentoCore
        product: BentoTermLink
      - package: BentoCore
        product: SwiftTmux
      - package: BentoCore
        product: BentoVoiceKit
      - package: BentoCore
        product: BentoFilePreviewKit
      - package: BentoCore
        product: BentoUI
      - package: BentoCore
        product: BentoFoundation
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bento uses Face ID to protect your SSH keys."
        INFOPLIST_KEY_NSCameraUsageDescription: "Bento uses the camera to scan the pairing QR code shown by your Mac."
        ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: apps/BentoTermIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.app
        # Artifact name differs (avoids Products/ collision with the ACP iOS
        # app); the HOME SCREEN name stays "Bento" exactly as shipped.
        PRODUCT_NAME: "Bento Term"
        INFOPLIST_KEY_CFBundleDisplayName: "Bento"

  # BentoTermIOSTests (frozen HostStore/TmuxParser/SessionManager XCTests) retired
  # with the SSH stack. Product B's store-level coverage now lives in the root
  # package's Swift test suite (BentoTmuxPane / BentoShelliOS), run by `swift test`.

  BentoTermMac:
    type: application
    platform: macOS
    sources:
      - apps/BentoTermMac/Sources
      - apps/BentoTermMac/Resources/Assets.xcassets
    dependencies:
      # Product B on TRUNK modules: the tmux-backed AppKit shell + the narrow
      # products the app sources import. BentoTmuxPane + BentoTerminalPane
      # (libghostty) ride in transitively via BentoShellTermMac; BentoCore's
      # umbrella (ACP + BentoShellMac) is deliberately NOT linked.
      - package: BentoCore
        product: BentoShellTermMac
      - package: BentoCore
        product: BentoFoundation
      - package: BentoCore
        product: BentoUI
      # FOLLOW-UP: this is the host-scoped daemon module, and Bento Term has no
      # daemon. It survives only because FirstRunWindow and SettingsView still
      # reference BentoCLI/DaemonStatus for screens that are themselves being
      # replaced (the first-run flow becomes a host list). Drop it with them.
      - package: BentoCore
        product: BentoMenuKit
    settings:
      base:
        PRODUCT_NAME: Bento Term
        GENERATE_INFOPLIST_FILE: true
        # Merged with the generated plist — carries the `bento-term://` URL
        # scheme only. docs/menubar-unification.md §4.1.
        INFOPLIST_FILE: apps/BentoTermMac/Info.plist
        # NOT LSUIElement any more: a normal Dock icon, and ⌘Q means ⌘Q. The
        # menu-bar residency existed to represent a daemon this product no
        # longer has — the thing that outlives a closed window is the user's
        # own tmux server, which needs nothing from us to do it.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Bento Term"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento Term needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento Term uses speech recognition to convert voice to text and shell commands."
        # Its own identity, so it installs alongside the terminal-era build
        # (com.bento.menubar) and the ACP app (com.bento.menubar.acp) instead
        # of inheriting either one's defaults, keychain, or saved workspace.
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/BentoTermMac/Resources/BentoMenubar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed Go binaries (trunk bento + bento-daemon) + bundled tmux"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # P7: product B now rides the TRUNK daemon (daemon/), same unified
          # binary product A embeds — not the frozen desktop-term fork.
          ( cd "$SRCROOT/daemon" && make build )
          # APFS is case-insensitive, so the Swift `Bento` executable would
          # collide with the Go `bento` CLI in Contents/MacOS. Put helpers in
          # a sibling `helpers/` subdir so each binary has a distinct path.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          cp -f "$SRCROOT/daemon/bin/bento"        "$DEST/"
          cp -f "$SRCROOT/daemon/bin/bento-daemon" "$DEST/"
          # Bundle tmux so the daemon's tmux host works on Macs with no system
          # tmux. Best-effort: the trunk daemon ships a bundled slot if built;
          # otherwise fall back to a system tmux at runtime.
          slot="darwin-$(uname -m)"
          if [ -f "$SRCROOT/daemon/bin/bundled/tmux-$slot" ]; then
            cp -f "$SRCROOT/daemon/bin/bundled/tmux-$slot" "$DEST/tmux"
            chmod +x "$DEST/tmux"
          else
            echo "warning: no bundled tmux for $slot; the daemon will need a system tmux" >&2
          fi
