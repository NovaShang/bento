name: Bento
options:
  bundleIdPrefix: com.bento
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.4"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 7M23245ZBD

packages:
  BentoCore:
    path: .
  # ---- Bento Term (product B) — frozen term-side stack ----
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.2.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"
  SwiftTmux:
    path: frozen/swift-tmux
  BentoTerminalCore:
    path: frozen/bento-terminal-core

targets:
  BentoIOS:
    type: application
    platform: iOS
    sources:
      - apps/BentoIOS/Sources
      - apps/BentoIOS/Resources
      - apps/BentoIOS/Assets.xcassets
    dependencies:
      - package: BentoCore
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # iPad multitasking (Split View / Stage Manager free-resize) requires an
        # EXPLICIT all-four-orientation declaration — an absent key leaves the
        # app locked to a fixed window. iPhone keeps the default (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text for your agents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bento uses Face ID to protect your pairing keys."
        INFOPLIST_KEY_NSCameraUsageDescription: "Bento uses the camera to scan the pairing QR code shown by your Mac."
        ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: apps/BentoIOS/Info.plist
        # Target renamed BentoIOS; the artifact stays Bento.app.
        PRODUCT_NAME: Bento
        CODE_SIGN_STYLE: Automatic
        # ACP build: own id so it installs ALONGSIDE the terminal version
        # with a fresh container (no shared defaults/keychain/pairing).
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.app.acp
        # ...and its own name on the home screen, for the same reason: two
        # icons both labelled "Bento" is how the dev loop spent a session
        # driving the wrong app.
        INFOPLIST_KEY_CFBundleDisplayName: "Bento ACP"

  BentoIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/BentoIOSTests
    dependencies:
      - target: BentoIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  BentoMac:
    type: application
    platform: macOS
    sources:
      - apps/BentoMac/Sources
      - apps/BentoMac/Resources/Assets.xcassets
    dependencies:
      - package: BentoCore
    settings:
      base:
        # User-facing product name is "Bento ACP" — distinct from the old
        # terminal-era "Bento.app" so both can live in /Applications and run
        # side by side. The internal target name stays BentoMenubar to avoid
        # an Xcode-level collision with the iOS Bento target.
        PRODUCT_NAME: Bento ACP
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true       # menubar-only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Bento ACP"
        # Voice input touches the mic + (Apple engine) speech recognition. Without
        # these usage-description keys macOS TCC HARD-ABORTS the app the moment it
        # accesses the mic — the "hold right-click to record → crash" (BUG-017).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text for your agents."
        # Own bundle id (.acp suffix) so this installs alongside the old
        # terminal-era Bento menubar app (com.bento.menubar) with its own
        # prefs + Launch Services identity.
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.menubar.acp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App version surfaced in Finder/About and reported by Telemetry
        # (CFBundleShortVersionString). Bump alongside release tags.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/BentoMac/Resources/BentoMenubar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed Go binaries (bento + bento-daemon)"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ( cd "$SRCROOT/daemon" && make build )
          # APFS is case-insensitive, so the Swift `Bento` executable would
          # collide with the Go `bento` CLI in Contents/MacOS. Put helpers in
          # a sibling `helpers/` subdir so each binary has a distinct path.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          cp -f "$SRCROOT/daemon/bin/bento"        "$DEST/"
          cp -f "$SRCROOT/daemon/bin/bento-daemon" "$DEST/"

  # ════════ Bento Term (product B) — sources & behavior frozen from the ════════
  # terminal branch (merge^2). Same bundle ids as the shipping terminal apps;
  # only target names and directory prefixes differ (BentoTerm*/desktop-term)
  # so both products coexist in one project. Daemon unification is P7.
  BentoTermIOS:
    type: application
    platform: iOS
    sources:
      - apps/BentoTermIOS/Sources
      - apps/BentoTermIOS/Resources
      - apps/BentoTermIOS/Assets.xcassets
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: SwiftTmux
      - package: BentoTerminalCore
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bento uses Face ID to protect your SSH keys."
        INFOPLIST_KEY_NSCameraUsageDescription: "Bento uses the camera to scan the pairing QR code shown by your Mac."
        ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: apps/BentoTermIOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.app
        # Artifact name differs (avoids Products/ collision with the ACP iOS
        # app); the HOME SCREEN name stays "Bento" exactly as shipped.
        PRODUCT_NAME: "Bento Term"
        INFOPLIST_KEY_CFBundleDisplayName: "Bento"

  BentoTermIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/BentoTermIOSTests
    dependencies:
      - target: BentoTermIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  BentoTermMac:
    type: application
    platform: macOS
    sources:
      - apps/BentoTermMac/Sources
      - apps/BentoTermMac/Resources/Assets.xcassets
    dependencies:
      - package: BentoTerminalCore
    settings:
      base:
        PRODUCT_NAME: Bento
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Bento"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.menubar
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/BentoTermMac/Resources/BentoMenubar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed Go binaries (bento + bento-daemon) + bundled tmux"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ( cd "$SRCROOT/frozen/desktop-term" && make build )
          # APFS is case-insensitive, so the Swift `Bento` executable would
          # collide with the Go `bento` CLI in Contents/MacOS. Put helpers in
          # a sibling `helpers/` subdir so each binary has a distinct path.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          cp -f "$SRCROOT/frozen/desktop-term/bin/bento"        "$DEST/"
          cp -f "$SRCROOT/frozen/desktop-term/bin/bento-daemon" "$DEST/"
          # Bundle tmux so tmux -CC works on Macs with no system tmux.
          slot="darwin-$(uname -m)"
          if [ -f "$SRCROOT/frozen/desktop-term/bin/bundled/tmux-$slot" ]; then
            cp -f "$SRCROOT/frozen/desktop-term/bin/bundled/tmux-$slot" "$DEST/tmux"
            chmod +x "$DEST/tmux"
          else
            echo "warning: no bundled tmux for $slot; app will need a system tmux" >&2
          fi
