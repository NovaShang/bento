			shellPath = /bin/sh;
			shellScript = "set -e\n# Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n( cd \"$SRCROOT/frozen/desktop-term\" && make build )\n# APFS is case-insensitive, so the Swift `Bento` executable would\n# collide with the Go `bento` CLI in Contents/MacOS. Put helpers in\n# a sibling `helpers/` subdir so each binary has a distinct path.\nDEST=\"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers\"\nmkdir -p \"$DEST\"\ncp -f \"$SRCROOT/frozen/desktop-term/bin/bento\"        \"$DEST/\"\ncp -f \"$SRCROOT/frozen/desktop-term/bin/bento-daemon\" \"$DEST/\"\n# Bundle tmux so tmux -CC works on Macs with no system tmux.\nslot=\"darwin-$(uname -m)\"\nif [ -f \"$SRCROOT/frozen/desktop-term/bin/bundled/tmux-$slot\" ]; then\n  cp -f \"$SRCROOT/frozen/desktop-term/bin/bundled/tmux-$slot\" \"$DEST/tmux\"\n  chmod +x \"$DEST/tmux\"\nelse\n  echo \"warning: no bundled tmux for $slot; app will need a system tmux\" >&2\nfi\n";
		};
