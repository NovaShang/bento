			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n# P7: product B now rides the TRUNK daemon (daemon/), same unified\n# binary product A embeds — not the frozen desktop-term fork.\n( cd \"$SRCROOT/daemon\" && make build )\n# APFS is case-insensitive, so the Swift `Bento` executable would\n# collide with the Go `bento` CLI in Contents/MacOS. Put helpers in\n# a sibling `helpers/` subdir so each binary has a distinct path.\nDEST=\"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers\"\nmkdir -p \"$DEST\"\ncp -f \"$SRCROOT/daemon/bin/bento\"        \"$DEST/\"\ncp -f \"$SRCROOT/daemon/bin/bento-daemon\" \"$DEST/\"\n# Bundle tmux so the daemon's tmux host works on Macs with no system\n# tmux. Best-effort: the trunk daemon ships a bundled slot if built;\n# otherwise fall back to a system tmux at runtime.\nslot=\"darwin-$(uname -m)\"\nif [ -f \"$SRCROOT/daemon/bin/bundled/tmux-$slot\" ]; then\n  cp -f \"$SRCROOT/daemon/bin/bundled/tmux-$slot\" \"$DEST/tmux\"\n  chmod +x \"$DEST/tmux\"\nelse\n  echo \"warning: no bundled tmux for $slot; the daemon will need a system tmux\" >&2\nfi\n";
